# Publica el sitio en GitHub Pages. Requisito: Settings -> Pages -> Source: "GitHub Actions".
# La fuente de verdad es Web/ en el repo del juego; este repo es su copia publicable.
name: Publicar sitio Cat Bubble Island

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Modo estricto: falla si falta un dato, si queda un marcador o si hay enlaces rotos.
      - run: python3 build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
